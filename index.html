<html lang="en">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      --bg-end: #1f222c;

      --orb-b: rgba(139, 233, 253, 0.12);
      --panel: rgba(40, 42, 54, 0.88);
      --panel-strong: rgba(52, 55, 70, 0.96);
      --line: rgba(80, 250, 123, 0.18);
      --text: #f8f8f2;
      --muted: #b7bdcc;
      --accent: #50fa7b;
      --accent-soft: #8be9fd;
      --accent-warm: #f1fa8c;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    body[data-theme="light"] {
      color-scheme: light;
      --bg-start: #f6f7fb;
      --bg-end: #dfe7e1;
      --orb-a: rgba(80, 250, 123, 0.18);
      --orb-b: rgba(98, 114, 164, 0.12);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(244, 247, 250, 0.96);
      --line: rgba(68, 71, 90, 0.14);
      --text: #282a36;
      --muted: #5d6477;
      --accent: #157f3b;
      --accent-soft: #357e95;
      --accent-warm: #7f8c2c;
      --shadow: 0 24px 80px rgba(36, 44, 60, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans", "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, var(--orb-a), transparent 28%),
        radial-gradient(circle at top right, var(--orb-b), transparent 24%),
        linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      overflow-x: hidden;
      transition: background 220ms ease, color 220ms ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 38rem;
      height: 38rem;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -10rem;
      left: -9rem;
      background: rgba(80, 250, 123, 0.1);
    }

    body::after {
      right: -10rem;
      bottom: -12rem;
      background: rgba(139, 233, 253, 0.08);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    .hero,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .hero {
      padding: 1.2rem 1.2rem 1.6rem;
      overflow: hidden;
    }

    .hero-top {
      display: flex;
      justify-content: flex-end;
    }

    .theme-toggle {
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(80, 250, 123, 0.08);
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      flex: 0 0 auto;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      background: rgba(80, 250, 123, 0.14);
      border-color: var(--line);
    }

    .meta-row {
      display: none;
    }

    .pill {
      padding: 0.8rem 1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .digits {
      display: grid;
      grid-template-columns: minmax(220px, 1.45fr) repeat(3, minmax(140px, 1fr));
      gap: 1rem;
    }

    .digit-card {
      position: relative;
      padding: 1.35rem;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(80, 250, 123, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(80, 250, 123, 0.16);
      overflow: hidden;
    }

    .digit-card.days-card {
      padding-inline: 1.6rem;
    }

    .digit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(80, 250, 123, 0.08), transparent 50%);
      pointer-events: none;
    }

    .digit-value {
      font-size: clamp(2.6rem, 5vw, 4.4rem);
      line-height: 0.9;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
      text-shadow: 0 0 20px rgba(80, 250, 123, 0.12);
      white-space: nowrap;
      overflow: visible;
      color: var(--accent);
    }

    .days-card .digit-value {
      font-size: clamp(3rem, 5vw, 4.9rem);
    }

    .digit-label {
      display: inline-block;
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 1.25rem;
    }

    .panel {
      padding: 1.4rem;
    }

    .section-title {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }

    .section-subtitle {
      display: none;
    }

    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 0;
    }

    .location-card,
    .quote-card {
      border-radius: 22px;
      background: var(--panel-strong);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem;
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .city-name {
      margin: 0;
      font-size: 1.05rem;
    }

    .city-meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .city-time {
      margin-top: 0.9rem;
      font-size: 1.9rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .city-date {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .weather-status {
      color: var(--accent-warm);
      font-size: 1.4rem;
      line-height: 1;
    }

    .weather-temp {
      margin: 0.8rem 0 0;
      font-size: 2rem;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .weather-details {
      margin: 0.6rem 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.92rem;
    }

    .quote-card {
      margin-top: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .language-bar {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.55rem;
    }

    .lang-button {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .lang-button:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: rgba(80, 250, 123, 0.12);
    }

    .lang-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(80, 250, 123, 0.18);
      box-shadow: 0 0 0 2px rgba(80, 250, 123, 0.12);
    }

    .quote-layout {
      margin-top: 0;
      display: block;
      position: relative;
      z-index: 1;
      max-width: 42rem;
      margin-inline: auto;
    }

    .quote-content {
      min-width: 0;
      display: grid;
      gap: 0.45rem;
      justify-items: start;
    }

    .quote-card::before {
      content: "";
      position: absolute;
      inset: auto 0 0 auto;
      width: 12rem;
      height: 12rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(98, 208, 255, 0.16), transparent 65%);
      transform: translate(30%, 30%);
    }

    blockquote {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.65;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .quote-author {
      margin-top: 0.6rem;
      color: var(--accent);
      font-size: 0.98rem;
      letter-spacing: 0.03em;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .quote-note {
      margin-top: 0;
      color: var(--muted);
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 800ms ease forwards;
    }

    .fade-up.delay-1 {
      animation-delay: 100ms;
    }

    .fade-up.delay-2 {
      animation-delay: 200ms;
    }

    .fade-up.delay-3 {
      animation-delay: 300ms;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .location-grid,
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .digits {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 1rem, 100%);
        padding: 1rem 0 2rem;
      }

      .hero,
      .panel {
        border-radius: 22px;
      }

      .hero-top {
        flex-direction: row;
        align-items: flex-start;
      }

      .hero,
      .panel,
      .location-card,
      .quote-card,
      .digit-card {
        padding: 1rem;
      }

      .digits,
      .location-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        max-width: none;
      }
    }
  </style>
</head>

    function applyTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem("theme-preference", theme);
      const button = document.getElementById("theme-toggle");
      const isLight = theme === "light";
      button.textContent = isLight ? "◑" : "◐";
      button.setAttribute("aria-label", isLight ? "toggle dark mode" : "toggle bright mode");
      button.setAttribute("title", isLight ? "toggle dark mode" : "toggle bright mode");
    }

    function setupThemeToggle() {
      const savedTheme = localStorage.getItem("theme-preference");
      const preferredTheme = savedTheme || "dark";
      applyTheme(preferredTheme);

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const nextTheme = document.body.dataset.theme === "light" ? "dark" : "light";
        applyTheme(nextTheme);
      });
    }

    function applyLanguage(lang) {
      currentLanguage = i18n[lang] ? lang : "en";
      localStorage.setItem("language-preference", currentLanguage);

      document.querySelectorAll(".lang-button").forEach((button) => {
        const selected = button.dataset.lang === currentLanguage;
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });

      document.getElementById("days").nextElementSibling.textContent = t("days");
      document.getElementById("hours").nextElementSibling.textContent = t("hours");
      document.getElementById("minutes").nextElementSibling.textContent = t("minutes");
      document.getElementById("seconds").nextElementSibling.textContent = t("seconds");

      document.documentElement.lang = currentLanguage;
      renderLocations();
      loadWeather();
    }

    function setupLanguageSelector() {
      const savedLanguage = localStorage.getItem("language-preference") || "en";
      document.querySelectorAll(".lang-button").forEach((button) => {
        button.addEventListener("click", () => {
          applyLanguage(button.dataset.lang);
        });
      });
      applyLanguage(savedLanguage);
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();
      const distance = targetDate.getTime() - now.getTime();
      const safeDistance = Math.max(distance, 0);

      const days = Math.floor(safeDistance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((safeDistance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((safeDistance / (1000 * 60)) % 60);
      const seconds = Math.floor((safeDistance / 1000) % 60);

      document.getElementById("days").textContent = String(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);

      const endOfDay = new Date(now);
      endOfDay.setHours(23, 59, 59, 999);
      const dayLeftMs = endOfDay.getTime() - now.getTime();
      const dayLeftHours = Math.floor(dayLeftMs / (1000 * 60 * 60));
      const dayLeftMinutes = Math.floor((dayLeftMs / (1000 * 60)) % 60);
      document.getElementById("today-progress").textContent =
        pad(dayLeftHours) + "h " + pad(dayLeftMinutes) + "m left today";
    }

    function renderLocations() {
      const locationGrid = document.getElementById("location-grid");
      locationGrid.innerHTML = locations.map((location) => {
        return `
          <article class="location-card" id="location-${location.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]+/g, "-")}">
            <div class="location-header">
              <div>
                <h3 class="city-name">${location.name}</h3>
                <div class="city-meta">${location.meta}</div>
              </div>
              <span class="weather-status" aria-label="${t("loadingWeather")}">◌</span>
            </div>
            <div class="city-time"></div>
            <div class="city-date"></div>
            <p class="weather-temp">--°C</p>
            <p class="weather-details">${t("fetchingWeather").replace("{city}", location.city)}</p>
          </article>
        `;
      }).join("");

      updateLocationTimes();
    }

    function updateLocationTimes() {
      locations.forEach((location) => {
        const card = document.getElementById("location-" + location.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]+/g, "-"));
        if (!card) {
          return;
        }

        const time = new Intl.DateTimeFormat("en-GB", {
          timeZone: location.zone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(new Date());

        const date = new Intl.DateTimeFormat("en-US", {
          timeZone: location.zone,
          weekday: "long",
          month: "long",
          day: "numeric"
        }).format(new Date());

        card.querySelector(".city-time").textContent = time;
        card.querySelector(".city-date").textContent = date;
      });
    }

    function pickDailyQuote() {
      const now = new Date();
      const seed = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000;
      const quote = entrepreneurQuotes[seed % entrepreneurQuotes.length];
      document.getElementById("quote-text").textContent = quote.text;
      document.getElementById("quote-author").textContent = quote.author;
      document.getElementById("quote-note").textContent = quote.note;
    }

    async function loadWeather() {
      await Promise.all(locations.map(async (location) => {
        const cardId = "location-" + location.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z]+/g, "-");
        const card = document.getElementById(cardId);
        const status = card.querySelector(".weather-status");
        const temp = card.querySelector(".weather-temp");
        const details = card.querySelector(".weather-details");

        try {
          const url = new URL("https://api.open-meteo.com/v1/forecast");
          url.searchParams.set("latitude", location.latitude);
          url.searchParams.set("longitude", location.longitude);
          url.searchParams.set("current", "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m");
          url.searchParams.set("timezone", "auto");

          const response = await fetch(url);
          if (!response.ok) {
            throw new Error("Weather request failed");
          }

          const data = await response.json();
          const current = data.current;
          const weatherLabel = weatherCodeMap[current.weather_code] || "•";

          status.textContent = weatherLabel;
          status.setAttribute("aria-label", t("weatherSymbol").replace("{symbol}", weatherLabel));
          temp.textContent = Math.round(current.temperature_2m) + "°C";
          details.textContent =
            t("humidity") + " " + current.relative_humidity_2m + "% • " + t("wind") + " " +
            Math.round(current.wind_speed_10m) + " km/h • " + location.city;
        } catch (error) {
          status.textContent = "·";
          status.setAttribute("aria-label", t("weatherUnavailable"));
          temp.textContent = "--°C";
          details.textContent = t("weatherUnavailableMsg");
        }
      }));
    }

    function init() {
      setupThemeToggle();
      setupLanguageSelector();
      updateCountdown();
      pickDailyQuote();

      setInterval(updateCountdown, 1000);
      setInterval(updateLocationTimes, 1000);
    }

    init();
  </script>
</body>
</html>
