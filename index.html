<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>time remaining</title>
  <meta name="description" content="Countdown, world clocks with live weather, and a daily entrepreneur quote.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a dark-to-light flash.
    try {
      if (localStorage.getItem("theme-preference") === "light") {
        document.documentElement.dataset.theme = "light";
      }
    } catch (error) {
      // storage unavailable; keep the default dark theme
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-start: #282a36;
      --bg-end: #1f222c;
      --orb-a: rgba(80, 250, 123, 0.16);
      --orb-b: rgba(139, 233, 253, 0.12);
      --panel: rgba(40, 42, 54, 0.88);
      --panel-strong: rgba(52, 55, 70, 0.96);
      --line: rgba(80, 250, 123, 0.18);
      --text: #f8f8f2;
      --muted: #b7bdcc;
      --accent: #50fa7b;
      --accent-soft: #8be9fd;
      --accent-warm: #f1fa8c;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      --glow-a: rgba(80, 250, 123, 0.1);
      --glow-b: rgba(139, 233, 253, 0.08);
      --surface-border: rgba(255, 255, 255, 0.08);
      --control-bg: rgba(255, 255, 255, 0.05);
      --control-border: rgba(255, 255, 255, 0.14);
      --popover-bg: rgba(20, 22, 32, 0.92);
      --popover-border: rgba(255, 255, 255, 0.08);
      --popover-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg-start: #f6f7fb;
      --bg-end: #dfe7e1;
      --orb-a: rgba(80, 250, 123, 0.18);
      --orb-b: rgba(98, 114, 164, 0.12);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(244, 247, 250, 0.96);
      --line: rgba(68, 71, 90, 0.14);
      --text: #282a36;
      --muted: #5d6477;
      --accent: #157f3b;
      --accent-soft: #357e95;
      --accent-warm: #7f8c2c;
      --shadow: 0 24px 80px rgba(36, 44, 60, 0.12);
      --glow-a: rgba(80, 250, 123, 0.12);
      --glow-b: rgba(98, 114, 164, 0.08);
      --surface-border: rgba(68, 71, 90, 0.12);
      --control-bg: rgba(255, 255, 255, 0.7);
      --control-border: rgba(68, 71, 90, 0.2);
      --popover-bg: rgba(255, 255, 255, 0.97);
      --popover-border: rgba(68, 71, 90, 0.16);
      --popover-shadow: 0 12px 28px rgba(36, 44, 60, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans", "Helvetica Neue", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, var(--orb-a), transparent 28%),
        radial-gradient(circle at top right, var(--orb-b), transparent 24%),
        linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      overflow-x: hidden;
      transition: background 220ms ease, color 220ms ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 38rem;
      height: 38rem;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -10rem;
      left: -9rem;
      background: var(--glow-a);
    }

    body::after {
      right: -10rem;
      bottom: -12rem;
      background: var(--glow-b);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    .hero,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .hero {
      padding: 1.2rem 1.2rem 1.6rem;
      overflow: hidden;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .hero-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .hero-tools,
    .section-tools {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-tools {
      width: 100%;
      justify-content: flex-end;
      margin-bottom: 0.7rem;
    }

    .theme-toggle {
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(80, 250, 123, 0.08);
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
      flex: 0 0 auto;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      background: rgba(80, 250, 123, 0.14);
      border-color: var(--line);
    }

    .section-toggle {
      min-width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(80, 250, 123, 0.08);
      color: var(--accent);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      line-height: 1;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .section-toggle:hover {
      transform: translateY(-1px);
      background: rgba(80, 250, 123, 0.14);
      border-color: var(--line);
    }

    .section-content[hidden] {
      display: none;
    }

    #content-countdown {
      margin-top: 1rem;
    }

    .digits {
      display: grid;
      grid-template-columns: minmax(220px, 1.45fr) repeat(3, minmax(140px, 1fr));
      gap: 1rem;
    }

    .countdown-title {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 1.65rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .digit-card {
      position: relative;
      padding: 1.35rem;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(80, 250, 123, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(80, 250, 123, 0.16);
      overflow: hidden;
    }

    .digit-card.days-card {
      padding-inline: 1.6rem;
    }

    .digit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(80, 250, 123, 0.08), transparent 50%);
      pointer-events: none;
    }

    .digit-value {
      font-size: clamp(2.6rem, 5vw, 4.4rem);
      line-height: 0.9;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
      text-shadow: 0 0 20px rgba(80, 250, 123, 0.12);
      white-space: nowrap;
      overflow: visible;
      color: var(--accent);
    }

    .days-card .digit-value {
      font-size: clamp(3rem, 5vw, 4.9rem);
    }

    .digit-label {
      display: inline-block;
      margin-top: 0.8rem;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 1.25rem;
    }

    .panel {
      padding: 1.4rem;
    }

    .section-title {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }

    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 0;
    }

    .location-card,
    .quote-card {
      border-radius: 22px;
      background: var(--panel-strong);
      border: 1px solid var(--surface-border);
      padding: 1rem;
    }

    .location-card {
      position: relative;
    }

    .location-card.has-picker {
      padding-bottom: 3rem;
    }

    .location-card.has-pin {
      padding-right: 3rem;
    }

    .location-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .location-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .city-name {
      margin: 0;
      font-size: 1.05rem;
    }

    .city-flag {
      font-size: 0.95em;
      margin-right: 0.45rem;
      vertical-align: baseline;
    }

    .city-meta {
      margin-top: 0.3rem;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .city-time {
      margin-top: 0.9rem;
      font-size: 1.9rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .city-date {
      margin-top: 0.4rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .weather-status {
      color: var(--accent-warm);
      font-size: 1.4rem;
      line-height: 1;
    }

    .pin-toggle {
      width: 1.55rem;
      height: 1.55rem;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      font-size: 0.78rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .pin-toggle.floating {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      z-index: 2;
    }

    .pin-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: rgba(80, 250, 123, 0.12);
    }

    .pin-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(80, 250, 123, 0.18);
    }

    .weather-temp {
      margin: 0.8rem 0 0;
      font-size: 2rem;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    .weather-details {
      margin: 0.6rem 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.92rem;
    }

    .location-picker {
      position: absolute;
      right: 0.75rem;
      bottom: 0.75rem;
      z-index: 2;
    }

    .location-picker summary {
      width: 1.55rem;
      height: 1.55rem;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      font-size: 0.85rem;
      list-style: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .location-picker summary:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: rgba(80, 250, 123, 0.12);
    }

    .location-picker summary::-webkit-details-marker {
      display: none;
    }

    .location-picker summary::before {
      content: "◎";
      font-size: 0.9rem;
      transition: transform 140ms ease;
    }

    .location-picker[open] summary::before {
      transform: rotate(90deg);
    }

    .location-options {
      position: absolute;
      right: 0;
      bottom: 2rem;
      display: grid;
      gap: 0.38rem;
      max-height: 9.5rem;
      overflow-y: auto;
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid var(--popover-border);
      background: var(--popover-bg);
      box-shadow: var(--popover-shadow);
      min-width: 11.5rem;
    }

    .location-card.has-pin .location-picker {
      right: 2.65rem;
    }

    .location-option {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.25;
    }

    .location-option input {
      margin: 0;
      accent-color: var(--accent);
    }

    .quote-card {
      margin-top: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .language-bar {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 0.55rem;
    }

    .lang-button {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .lang-button:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: rgba(80, 250, 123, 0.12);
    }

    .lang-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(80, 250, 123, 0.18);
      box-shadow: 0 0 0 2px rgba(80, 250, 123, 0.12);
    }

    .quote-layout {
      margin-top: 0;
      display: block;
      position: relative;
      z-index: 1;
      max-width: 42rem;
      margin-inline: auto;
    }

    .quote-content {
      min-width: 0;
      display: grid;
      gap: 0.45rem;
      justify-items: start;
    }

    .quote-card::before {
      content: "";
      position: absolute;
      inset: auto 0 0 auto;
      width: 12rem;
      height: 12rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(98, 208, 255, 0.16), transparent 65%);
      transform: translate(30%, 30%);
    }

    blockquote {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.65;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .quote-author {
      margin-top: 0.6rem;
      color: var(--accent);
      font-size: 0.98rem;
      letter-spacing: 0.03em;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .quote-note {
      margin-top: 0;
      color: var(--muted);
      font-size: 0.9rem;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 800ms ease forwards;
    }

    .fade-up.delay-1 {
      animation-delay: 100ms;
    }

    .fade-up.delay-2 {
      animation-delay: 200ms;
    }

    .fade-up.delay-3 {
      animation-delay: 300ms;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .digits {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }

      .fade-up {
        opacity: 1;
        transform: none;
      }

      .theme-toggle:hover,
      .section-toggle:hover,
      .pin-toggle:hover,
      .lang-button:hover,
      .location-picker summary:hover {
        transform: none;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 1rem, 100%);
        padding: 1rem 0 2rem;
      }

      .hero,
      .panel {
        border-radius: 22px;
      }

      .hero-top {
        flex-direction: row;
        align-items: flex-start;
      }

      .hero,
      .panel,
      .location-card,
      .quote-card,
      .digit-card {
        padding: 1rem;
      }

      .digits,
      .location-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero fade-up" id="section-countdown">
      <div class="hero-top">
        <div class="hero-title-wrap">
          <h1 class="countdown-title">Carpe diem</h1>
        </div>
        <div class="hero-tools">
          <button class="section-toggle" type="button" data-section-id="section-countdown" data-content-id="content-countdown" data-section-key="sectionCountdown" aria-expanded="true" aria-label="collapse countdown" title="collapse countdown">−</button>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="toggle bright mode" title="toggle bright mode">◐</button>
        </div>
      </div>
      <div class="section-content" id="content-countdown">
        <div class="digits" id="countdown-digits">
          <article class="digit-card days-card">
            <div class="digit-value" id="days">0</div>
            <div class="digit-label">days</div>
          </article>
          <article class="digit-card">
            <div class="digit-value" id="hours">0</div>
            <div class="digit-label">hours</div>
          </article>
          <article class="digit-card">
            <div class="digit-value" id="minutes">0</div>
            <div class="digit-label">minutes</div>
          </article>
          <article class="digit-card">
            <div class="digit-value" id="seconds">0</div>
            <div class="digit-label">seconds</div>
          </article>
        </div>
      </div>
    </section>

    <section class="grid" id="section-locations">
      <div class="panel fade-up delay-1">
        <div class="section-tools">
          <button class="section-toggle" type="button" data-section-id="section-locations" data-content-id="content-locations" data-section-key="sectionLocations" aria-expanded="true" aria-label="collapse locations" title="collapse locations">−</button>
        </div>
        <div class="section-content" id="content-locations">
          <div class="location-grid" id="location-grid"></div>
        </div>
      </div>
    </section>

    <section class="quote-card fade-up delay-3" id="section-quote">
      <div class="section-tools">
        <button class="section-toggle" type="button" data-section-id="section-quote" data-content-id="content-quote" data-section-key="sectionQuote" aria-expanded="true" aria-label="collapse quote" title="collapse quote">−</button>
      </div>
      <div class="section-content" id="content-quote">
        <div class="quote-layout">
          <div class="quote-content">
            <blockquote id="quote-text"></blockquote>
            <div class="quote-author" id="quote-author"></div>
            <div class="quote-note" id="quote-note"></div>
          </div>
        </div>
      </div>
    </section>

    <div class="language-bar" id="language-bar" aria-label="language selector">
      <!-- Language names in their own language, so each is recognizable regardless of the current UI language. -->
      <button class="lang-button" type="button" data-lang="en" lang="en" aria-label="English" title="English" aria-pressed="true">🇬🇧</button>
      <button class="lang-button" type="button" data-lang="sv" lang="sv" aria-label="Svenska" title="Svenska" aria-pressed="false">🇸🇪</button>
      <button class="lang-button" type="button" data-lang="zh" lang="zh" aria-label="中文" title="中文" aria-pressed="false">🇨🇳</button>
      <button class="lang-button" type="button" data-lang="ja" lang="ja" aria-label="日本語" title="日本語" aria-pressed="false">🇯🇵</button>
    </div>
  </main>

        unpinCity: "lossa stad",
        toggleLight: "växla till ljust läge",
        toggleDark: "växla till mörkt läge",
        languageSelector: "språkval"
      },
      zh: {
        pageTitleCountdown: "剩余时间",
        pageTitleCountup: "额外时间",
        days: "天",
        hours: "小时",
        minutes: "分钟",
        seconds: "秒",
        loadingWeather: "正在加载天气",
        fetchingWeather: "正在获取{city}的实时天气。",
        weatherSymbol: "天气符号 {symbol}",
        weatherUnavailable: "天气不可用",
        weatherUnavailableMsg: "暂时无法获取天气，请检查网络后刷新。",
        humidity: "湿度",
        wind: "风速",
        collapseSection: "收起",
        expandSection: "展开",
        sectionCountdown: "倒计时",
        sectionLocations: "地点",
        sectionQuote: "语录",
        chooseLocation: "选择地点",
        chooseRotation: "选择轮播地点",
        pinCity: "固定城市",
        unpinCity: "取消固定城市",
        toggleLight: "切换到浅色模式",
        toggleDark: "切换到深色模式",
        languageSelector: "语言选择"
      },
      ja: {
        pageTitleCountdown: "残り時間",
        pageTitleCountup: "延長時間",
        days: "日",
        hours: "時間",
        minutes: "分",
        seconds: "秒",
        loadingWeather: "天気を読み込み中",
        fetchingWeather: "{city}の現在の天気を取得中です。",
        weatherSymbol: "天気記号 {symbol}",
        weatherUnavailable: "天気データなし",
        weatherUnavailableMsg: "天気を取得できません。ネットワークを確認して更新してください。",
        humidity: "湿度",
        wind: "風",
        collapseSection: "折りたたむ",
        expandSection: "展開",
        sectionCountdown: "カウントダウン",
        sectionLocations: "都市",
        sectionQuote: "引用",
        chooseLocation: "都市を選ぶ",
        chooseRotation: "ローテーション地点を選ぶ",
        pinCity: "都市を固定",
        unpinCity: "都市の固定を解除",
        toggleLight: "ライトモードに切り替え",
        toggleDark: "ダークモードに切り替え",
        languageSelector: "言語選択"
      }
    };

    let currentLanguage = "en";

    // localStorage can throw (privacy modes, sandboxed file:// pages); fail quietly.
    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        // ignore
      }
    }

    function t(key) {
      const dict = i18n[currentLanguage] || i18n.en;
      return dict[key] || i18n.en[key] || key;
    }

    function applySectionState(button, collapsed) {
      const section = document.getElementById(button.dataset.sectionId);
      const content = document.getElementById(button.dataset.contentId);
      if (!section || !content) {
        return;
      }

      section.classList.toggle("is-collapsed", collapsed);
      content.hidden = collapsed;
      button.setAttribute("aria-expanded", collapsed ? "false" : "true");
      button.textContent = collapsed ? "+" : "−";

      const action = collapsed ? t("expandSection") : t("collapseSection");
      const sectionName = t(button.dataset.sectionKey);
      const label = action + " " + sectionName;
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    }

    function refreshSectionToggleLabels() {
      document.querySelectorAll(".section-toggle").forEach((button) => {
        const collapsed = button.getAttribute("aria-expanded") === "false";
        applySectionState(button, collapsed);
      });
    }

    function setupSectionToggles() {
      const defaultCollapsed = {
        "section-countdown": true,
        "section-locations": false,
        "section-quote": false
      };

      document.querySelectorAll(".section-toggle").forEach((button) => {
        const sectionId = button.dataset.sectionId;
        applySectionState(button, Boolean(defaultCollapsed[sectionId]));

        button.addEventListener("click", () => {
          const collapsed = button.getAttribute("aria-expanded") === "false";
          applySectionState(button, !collapsed);
        });
      });
    }

    function updatePageTitle(distance) {
      const key = distance >= 0 ? "pageTitleCountdown" : "pageTitleCountup";
      document.title = t(key);
    }

    const weatherCodeMap = {
      0: "☀",
      1: "⛅",
      2: "⛅",
      3: "☁",
      45: "🌫",
      48: "🌫",
      51: "🌦",
      53: "🌦",
      55: "🌧",
      56: "🌧",
      57: "🌧",
      61: "🌧",
      63: "🌧",
      65: "⛈",
      66: "🌧",
      67: "⛈",
      71: "🌨",
      73: "🌨",
      75: "❄",
      77: "❄",
      80: "🌦",
      81: "🌧",
      82: "⛈",
      85: "🌨",
      86: "❄",
      95: "⛈",
      96: "⛈",
      99: "⛈"
    };

    function refreshThemeToggleLabel() {
      const button = document.getElementById("theme-toggle");
      const isLight = document.documentElement.dataset.theme === "light";
      const label = isLight ? t("toggleDark") : t("toggleLight");
      button.textContent = isLight ? "◑" : "◐";
      button.setAttribute("aria-label", label);
      button.setAttribute("title", label);
    }

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      storageSet("theme-preference", theme);
      refreshThemeToggleLabel();
    }

    function setupThemeToggle() {
      // The inline <head> script already applied the saved theme before first paint.
      applyTheme(storageGet("theme-preference") === "light" ? "light" : "dark");

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        applyTheme(nextTheme);
      });
    }

    function applyLanguage(lang) {
      currentLanguage = i18n[lang] ? lang : "en";
      storageSet("language-preference", currentLanguage);

      document.getElementById("language-bar").setAttribute("aria-label", t("languageSelector"));
      refreshThemeToggleLabel();

      document.querySelectorAll(".lang-button").forEach((button) => {
        const selected = button.dataset.lang === currentLanguage;
        button.setAttribute("aria-pressed", selected ? "true" : "false");
      });

      document.getElementById("days").nextElementSibling.textContent = t("days");
      document.getElementById("hours").nextElementSibling.textContent = t("hours");
      document.getElementById("minutes").nextElementSibling.textContent = t("minutes");
      document.getElementById("seconds").nextElementSibling.textContent = t("seconds");

      document.documentElement.lang = currentLanguage;
      const distance = targetDate.getTime() - Date.now();
      updatePageTitle(distance);
      refreshSectionToggleLabels();
      renderLocations();
      loadWeather();
      pickDailyQuote();
    }

    function setupLanguageSelector() {
      const savedLanguage = storageGet("language-preference") || "en";
      document.querySelectorAll(".lang-button").forEach((button) => {
        button.addEventListener("click", () => {
          applyLanguage(button.dataset.lang);
        });
      });
      applyLanguage(savedLanguage);
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();
      const distance = targetDate.getTime() - now.getTime();
      const activeDistance = distance >= 0 ? distance : Math.abs(distance);
      updatePageTitle(distance);

      const days = Math.floor(activeDistance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((activeDistance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((activeDistance / (1000 * 60)) % 60);
      const seconds = Math.floor((activeDistance / 1000) % 60);

      document.getElementById("days").textContent = String(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    function renderLocations() {
      const locationGrid = document.getElementById("location-grid");
      locationGrid.innerHTML = locations.map((location, index) => {
        return getLocationCardMarkup(location, index);
      }).join("");

      updateLocationTimes();
    }

    function getLocationCardId(location, index) {
      if (index === 3) {
        return "location-rotating";
      }
      return "location-slot-" + (index + 1);
    }

    function getLocationText(location, key) {
      const localized = location[key + "I18n"];
      if (localized && localized[currentLanguage]) {
        return localized[currentLanguage];
      }
      return location[key];
    }

    function getDateLocale() {
      const localeMap = {
        en: "en-US",
        sv: "sv-SE",
        zh: "zh-CN",
        ja: "ja-JP"
      };
      return localeMap[currentLanguage] || "en-US";
    }

    function getAlphabeticalLocations(list) {
      return [...list].sort((a, b) => {
        const aName = getLocationText(a, "name");
        const bName = getLocationText(b, "name");
        return aName.localeCompare(bName, getDateLocale(), { sensitivity: "base" });
      });
    }

    function getLocationCardMarkup(location, index) {
      const hasPicker = index === 1 || index === 2 || index === 3;
      const hasPin = index === 3;
      const cardClass = "location-card" + (hasPicker ? " has-picker" : "") + (hasPin ? " has-pin" : "");

      return `
        <article class="${cardClass}" id="${getLocationCardId(location, index)}">
          <div class="location-header">
            <div>
              <h2 class="city-name"><span class="city-flag" aria-hidden="true">${location.flag || ""}</span>${getLocationText(location, "name")}</h2>
              <div class="city-meta">${getLocationText(location, "meta")}</div>
            </div>
            <div class="location-actions">
              <span class="weather-status" role="img" aria-label="${t("loadingWeather")}">◌</span>
            </div>
          </div>
          <div class="city-time"></div>
          <div class="city-date"></div>
          <p class="weather-temp">--°C</p>
          <p class="weather-details">${t("fetchingWeather").replace("{city}", getLocationText(location, "city"))}</p>
          ${index === 1 || index === 2 ? getSingleLocationPickerMarkup(index) : ""}
          ${index === 3 ? getRotationPickerMarkup() : ""}
          ${index === 3 ? getFourthPanelPinButtonMarkup() : ""}
        </article>
      `;
    }

    function getSingleLocationPickerMarkup(index) {
      const groupName = index === 1 ? "location-slot-2" : "location-slot-3";
      const selectedKey = index === 1 ? selectedSecondLocationKey : selectedThirdLocationKey;
      // Prevent picking the city already shown in the other fixed slot.
      const otherKey = index === 1 ? selectedThirdLocationKey : selectedSecondLocationKey;
      const options = getAlphabeticalLocations(selectionLocationPool).map((location) => {
        const key = getLocationKey(location);
        const checked = key === selectedKey ? " checked" : "";
        const disabled = key === otherKey ? " disabled" : "";
        return `
          <label class="location-option">
            <input type="radio" name="${groupName}" value="${key}"${checked}${disabled}>
            <span>${location.flag || ""} ${getLocationText(location, "name")}</span>
          </label>
        `;
      }).join("");

      return `
        <details class="location-picker" data-picker="slot-${index}">
          <summary aria-label="${t("chooseLocation")}" title="${t("chooseLocation")}"></summary>
          <div class="location-options">${options}</div>
        </details>
      `;
    }

    function getRotationPickerMarkup() {
      const options = getAlphabeticalLocations(rotatingLocations).map((location) => {
        const key = getLocationKey(location);
        const checked = selectedRotationLocationKeys.has(key) ? " checked" : "";
        return `
          <label class="location-option">
            <input type="checkbox" name="location-rotation" value="${key}"${checked}>
            <span>${location.flag || ""} ${getLocationText(location, "name")}</span>
          </label>
        `;
      }).join("");

      return `
        <details class="location-picker" data-picker="rotation">
          <summary aria-label="${t("chooseRotation")}" title="${t("chooseRotation")}"></summary>
          <div class="location-options">${options}</div>
        </details>
      `;
    }

    function getFourthPanelPinButtonMarkup() {
      const title = isFourthPanelPinned ? t("unpinCity") : t("pinCity");
      const icon = isFourthPanelPinned ? "📌" : "📍";
      return `<button class="pin-toggle floating" type="button" data-action="toggle-fourth-pin" aria-label="${title}" title="${title}" aria-pressed="${isFourthPanelPinned ? "true" : "false"}">${icon}</button>`;
    }

    function getLocationByKey(key) {
      return selectionLocationPool.find((location) => getLocationKey(location) === key) || null;
    }

    function getActiveRotatingLocations() {
      const active = rotatingLocations.filter((location) => selectedRotationLocationKeys.has(getLocationKey(location)));
      return active.length > 0 ? active : [rotatingLocations[0]];
    }

    function isRotationPickerExpanded() {
      const picker = document.querySelector('#location-rotating details[data-picker="rotation"]');
      return Boolean(picker && picker.open);
    }

    function syncFourthLocationWithSelection(forceReset) {
      const active = getActiveRotatingLocations();
      const currentKey = locations[3] ? getLocationKey(locations[3]) : "";
      const existsInActive = active.some((location) => getLocationKey(location) === currentKey);
      if (!existsInActive || forceReset) {
        rotatingLocationIndex = 0;
        locations[3] = active[0];
      }
    }

    function rotateFourthLocation() {
      if (isFourthPanelPinned) {
        return;
      }
      if (isRotationPickerExpanded()) {
        return;
      }
      const activeRotatingLocations = getActiveRotatingLocations();
      if (activeRotatingLocations.length <= 1) {
        // Nothing to rotate to; avoid needless re-render.
        return;
      }
      rotatingLocationIndex = (rotatingLocationIndex + 1) % activeRotatingLocations.length;
      locations[3] = activeRotatingLocations[rotatingLocationIndex];
      const card = document.getElementById("location-rotating");
      if (card) {
        card.outerHTML = getLocationCardMarkup(locations[3], 3);
      }
      updateLocationTimes();
      loadWeather([3]);
    }

    function setupRotatingPanelPinToggle() {
      const grid = document.getElementById("location-grid");
      grid.addEventListener("click", (event) => {
        const button = event.target.closest(".pin-toggle");
        if (!button) {
          return;
        }
        isFourthPanelPinned = !isFourthPanelPinned;
        button.setAttribute("aria-pressed", isFourthPanelPinned ? "true" : "false");
        button.setAttribute("aria-label", isFourthPanelPinned ? t("unpinCity") : t("pinCity"));
        button.setAttribute("title", isFourthPanelPinned ? t("unpinCity") : t("pinCity"));
        button.textContent = isFourthPanelPinned ? "📌" : "📍";
        saveLocationState();
      });

      grid.addEventListener("change", (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) {
          return;
        }

        if (input.name === "location-slot-2" || input.name === "location-slot-3") {
          const selectedLocation = getLocationByKey(input.value);
          if (!selectedLocation) {
            return;
          }

          if (input.name === "location-slot-2") {
            selectedSecondLocationKey = input.value;
            locations[1] = selectedLocation;
          } else {
            selectedThirdLocationKey = input.value;
            locations[2] = selectedLocation;
          }

          saveLocationState();
          renderLocations();
          loadWeather();
          return;
        }

        if (input.name === "location-rotation") {
          if (input.checked) {
            selectedRotationLocationKeys.add(input.value);
          } else {
            selectedRotationLocationKeys.delete(input.value);
            if (selectedRotationLocationKeys.size === 0) {
              selectedRotationLocationKeys.add(input.value);
              input.checked = true;
              return;
            }
          }
          saveLocationState();

          // Keep the foldout open while selecting multiple locations.
          if (!isRotationPickerExpanded()) {
            syncFourthLocationWithSelection(true);
            renderLocations();
            loadWeather([3]);
          }
        }
      });
    }

    function updateLocationTimes() {
      if (!isRotationPickerExpanded()) {
        const active = getActiveRotatingLocations();
        const currentKey = locations[3] ? getLocationKey(locations[3]) : "";
        const isCurrentActive = active.some((location) => getLocationKey(location) === currentKey);
        if (!isCurrentActive) {
          syncFourthLocationWithSelection(true);
          renderLocations();
          loadWeather([3]);
          return;
        }
      }

      locations.forEach((location, index) => {
        const card = document.getElementById(getLocationCardId(location, index));
        if (!card) {
          return;
        }
        if (index === 3 && isRotationPickerExpanded()) {
          return;
        }

        const now = new Date();
        card.querySelector(".city-time").textContent = getTimeFormatter(location.zone).format(now);
        card.querySelector(".city-date").textContent = getDateFormatter(getDateLocale(), location.zone).format(now);
      });
    }

    // Intl formatters are relatively expensive to build; reuse them across ticks.
    const formatterCache = new Map();

    function getTimeFormatter(zone) {
      const key = "time|" + zone;
      if (!formatterCache.has(key)) {
        formatterCache.set(key, new Intl.DateTimeFormat("en-GB", {
          timeZone: zone,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }));
      }
      return formatterCache.get(key);
    }

    function getDateFormatter(locale, zone) {
      const key = "date|" + locale + "|" + zone;
      if (!formatterCache.has(key)) {
        formatterCache.set(key, new Intl.DateTimeFormat(locale, {
          timeZone: zone,
          weekday: "long",
          month: "long",
          day: "numeric"
        }));
      }
      return formatterCache.get(key);
    }

    function saveLocationState() {
      storageSet("location-state", JSON.stringify({
        second: selectedSecondLocationKey,
        third: selectedThirdLocationKey,
        rotation: Array.from(selectedRotationLocationKeys),
        pinned: isFourthPanelPinned,
        pinnedKey: isFourthPanelPinned && locations[3] ? getLocationKey(locations[3]) : null
      }));
    }

    // Restore saved selections, ignoring any keys that no longer match a known location.
    function loadLocationState() {
      let saved;
      try {
        saved = JSON.parse(storageGet("location-state") || "null");
      } catch (error) {
        saved = null;
      }
      if (!saved || typeof saved !== "object") {
        return;
      }

      const second = getLocationByKey(saved.second);
      const third = getLocationByKey(saved.third);
      if (second && third && saved.second !== saved.third) {
        selectedSecondLocationKey = saved.second;
        selectedThirdLocationKey = saved.third;
        locations[1] = second;
        locations[2] = third;
      }

      if (Array.isArray(saved.rotation)) {
        const validKeys = new Set(rotatingLocations.map((location) => getLocationKey(location)));
        const keys = saved.rotation.filter((key) => validKeys.has(key));
        if (keys.length > 0) {
          selectedRotationLocationKeys = new Set(keys);
        }
      }

      syncFourthLocationWithSelection(true);

      if (saved.pinned) {
        const active = getActiveRotatingLocations();
        const pinnedIndex = active.findIndex((location) => getLocationKey(location) === saved.pinnedKey);
        if (pinnedIndex >= 0) {
          isFourthPanelPinned = true;
          rotatingLocationIndex = pinnedIndex;
          locations[3] = active[pinnedIndex];
        }
      }
    }

    function pickDailyQuote() {
      const utc8Now = new Date(Date.now() + 8 * 60 * 60 * 1000);
      const seed = Date.UTC(utc8Now.getUTCFullYear(), utc8Now.getUTCMonth(), utc8Now.getUTCDate()) / 86400000;
      const quoteIndex = seed % entrepreneurQuotes.length;
      const quote = entrepreneurQuotes[quoteIndex];
      document.getElementById("quote-text").textContent = getLocalizedQuoteText(quote);
      document.getElementById("quote-author").textContent = quote.author;
      document.getElementById("quote-note").textContent = quote.note;
    }

    // Cache weather per city so re-renders and the 3s rotation don't hit the API.
    // Stores the in-flight promise too, so concurrent callers share one request.
    const WEATHER_TTL_MS = 15 * 60 * 1000;
    const weatherCache = new Map(); // locationKey -> { promise, ts }

    function fetchCurrentWeather(location) {
      const key = getLocationKey(location);
      const cached = weatherCache.get(key);
      if (cached && Date.now() - cached.ts < WEATHER_TTL_MS) {
        return cached.promise;
      }

      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", location.latitude);
      url.searchParams.set("longitude", location.longitude);
      url.searchParams.set("current", "temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m");
      url.searchParams.set("timezone", "auto");

      const promise = fetch(url)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Weather request failed");
          }
          return response.json();
        })
        .then((data) => data.current)
        .catch((error) => {
          // Don't cache failures; allow the next call to retry.
          weatherCache.delete(key);
          throw error;
        });

      weatherCache.set(key, { promise, ts: Date.now() });
      return promise;
    }

    async function loadWeather(indexes) {
      const targetIndexes = Array.isArray(indexes) ? indexes : locations.map((_, index) => index);
      await Promise.all(targetIndexes.map(async (index) => {
        const location = locations[index];
        const cardId = getLocationCardId(location, index);
        const card = document.getElementById(cardId);
        if (!card) {
          return;
        }
        const status = card.querySelector(".weather-status");
        const temp = card.querySelector(".weather-temp");
        const details = card.querySelector(".weather-details");

        try {
          const current = await fetchCurrentWeather(location);
          const weatherLabel = weatherCodeMap[current.weather_code] || "•";

          status.textContent = weatherLabel;
          status.setAttribute("aria-label", t("weatherSymbol").replace("{symbol}", weatherLabel));
          temp.textContent = Math.round(current.temperature_2m) + "°C";
          details.textContent =
            t("humidity") + " " + current.relative_humidity_2m + "% • " + t("wind") + " " +
            Math.round(current.wind_speed_10m) + " km/h • " + getLocationText(location, "city");
        } catch (error) {
          status.textContent = "·";
          status.setAttribute("aria-label", t("weatherUnavailable"));
          temp.textContent = "--°C";
          details.textContent = t("weatherUnavailableMsg");
        }
      }));
    }

    // Single clock tick aligned to the wall-clock second, so displayed seconds don't skip.
    function tick() {
      updateCountdown();
      updateLocationTimes();
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }

    function init() {
      syncFourthLocationWithSelection(true);
      loadLocationState();
      setupThemeToggle();
      setupSectionToggles();
      setupRotatingPanelPinToggle();
      setupLanguageSelector();
      pickDailyQuote();

      tick();
      setInterval(rotateFourthLocation, 3000);
    }

    init();
  </script>
