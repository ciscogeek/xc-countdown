<!DOCTYPE html><html><head><title>day1440</title><script>
    function countDown() {
      var now = new Date();
      var hours = 23 - now.getHours();
      var minutes = 59 - now.getMinutes();
      var seconds = 59 - now.getSeconds();
      var remainingTime = hours * 60 + minutes + 1;
      document.getElementById("countdown").innerHTML = remainingTime + " minutes left today.";
      setTimeout(countDown, 1000);
    }

    function daysBetweenDates(date1, date2) {
        // 计算两个日期的时间戳差值（毫秒数）
        const timeDiff = date2.getTime() - date1.getTime();
        // 计算时间戳差值对应的天数
        const daysDiff = Math.floor(timeDiff / (1000 * 3600 * 24));
        return daysDiff;
      }

      function showDaysDiff() {
        // 获取今天的日期
        const today = new Date();
        // 设置目标日期为2063年2月6日
        const targetDate = new Date("2063-02-07");
        // 计算相差的天数
        const daysDiff = daysBetweenDates(today, targetDate);
        // 将结果显示在网页上
        document.getElementById("days-diff").innerHTML = "Only " + daysDiff + " days left.";
      }


  </script>
</head>
  
  <body onload="countDown(); showDaysDiff()">
    <center> 
        <h1 id="days-diff"></h1>
        <h2 id="countdown"></h2>
    <img src="/img/time.jpeg">
    </center>
  </body>
  
  </html>
